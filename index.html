<style>

  /* Code blocks */
  .code {

  .box {

  .note { text-align: center; color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }

  .scrim { display: none; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }

  @media (prefers-reduced-motion: reduce) {

    .dots i { animation: none; opacity: .7; }
    .glow i { animation: none; }
    #bg { display: none; }
  }
</style>

<script>
// ضع هنا رابط الـ Worker بعد نشره على Cloudflare
const WORKER_URL = "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";

// 30 لغة برمجة (نفس القائمة في worker.js)
const CODE_LANGS = [
  "Python", "JavaScript", "TypeScript", "Java", "C", "C++", "C#", "Go",
  "Rust", "PHP", "Ruby", "Swift", "Kotlin", "Dart", "SQL", "Bash",
  "PowerShell", "Lua", "R", "HTML/CSS",
  "Scala", "Perl", "Haskell", "Elixir", "Julia", "MATLAB", "Objective-C",
  "Assembly", "Solidity", "Groovy"
];

const I18N = {
  ar: {
    toggle: "English",
    bg: "الخلفية",
    newChat: "محادثة جديدة",
    chats: "المحادثات",
    noChats: "لا توجد محادثات بعد",
    del: "حذف المحادثة",
    auto: "تلقائي",
    anyLang: "كل اللغات",
    placeholder: "اكتب طلبك البرمجي هنا",
    note: "قد تحتوي الإجابات على أخطاء. راجع الكود قبل استخدامه ولا ترسل بيانات سرية.",
    remaining: "المتبقي اليوم: ",
    emptyTitle: "ماذا نبني اليوم؟",
    emptyText: "اختر لغة البرمجة من الأسفل، ثم اكتب طلبك.",
    copy: "نسخ", copied: "تم النسخ", regen: "إعادة التوليد",
    errNetwork: "تعذر الاتصال بالخادم. تحقق من الإنترنت ومن رابط الـ Worker.",
    errConfig: "رابط الـ Worker غير مضبوط. عدّل WORKER_URL في index.html.",
    errLimit: "وصلت الحد اليومي. ارجع غداً.",
    errBusy: "الخدمة مشغولة حالياً. جرّب بعد قليل.",
    errGeneric: "حدث خطأ. حاول مرة أخرى."
  },
  en: {
    toggle: "عربي",
    bg: "Background",
    newChat: "New chat",
    chats: "Chats",
    noChats: "No chats yet",
    del: "Delete chat",
    auto: "Auto",
    anyLang: "All languages",
    placeholder: "Describe what you want to build",
    note: "Answers may contain mistakes. Review code before using it, and do not send confidential data.",
    remaining: "Left today: ",
    emptyTitle: "What are we building today?",
    emptyText: "Pick a programming language below, then describe your task.",
    copy: "Copy", copied: "Copied", regen: "Regenerate",
    errNetwork: "Could not reach the server. Check your connection and the Worker URL.",
    errConfig: "The Worker URL is not set. Edit WORKER_URL in index.html.",
    errLimit: "You reached today's limit. Come back tomorrow.",
    errBusy: "The service is busy right now. Try again shortly.",
    errGeneric: "Something went wrong. Please try again."
  }
};

// ---------- State ----------
let uiLang = "ar";
let chats = [];
let currentId = null;
let busy = false;
let lastRemaining = null;
try { uiLang = localStorage.getItem("pac_lang") || "ar"; } catch (e) {}
if (!I18N[uiLang]) uiLang = "ar";

const $ = (id) => document.getElementById(id);
const messagesEl = $("messages");
const inputEl = $("input");
const sendEl = $("send");
const t = () => I18N[uiLang];
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function loadChats() {
  try {
    const raw = JSON.parse(localStorage.getItem("pac_chats_v1") || "null");
    if (raw && Array.isArray(raw.chats)) { chats = raw.chats; currentId = raw.currentId; }
  } catch (e) {}
}
function saveChats() {
  try { localStorage.setItem("pac_chats_v1", JSON.stringify({ chats: chats.slice(0, 30), currentId })); } catch (e) {}
}
const current = () => chats.find((c) => c.id === currentId);

function newChat() {
  const existing = chats.find((c) => c.messages.length === 0);
  if (existing) { currentId = existing.id; }
  else {
    const c = { id: String(Date.now()), title: "", messages: [] };
    chats.unshift(c);
    currentId = c.id;
  }
  saveChats();
  renderAll();
}

// ---------- Rendering helpers ----------
function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const KW = new Set(("abstract and as assert async await break case catch class const continue def default defer del delete do elif else end enum except export extends extern false final finally fn for foreach from func function go goto if implements import in include init inline instanceof interface is lambda let local loop match module mut namespace new nil not null of or override package pass private protected pub public raise readonly ref return select self static struct super switch template then this throw throws trait true try type typeof union unsafe use using val var virtual void volatile when where while with yield int float double bool boolean string char long short byte unsigned signed print echo SELECT FROM WHERE INSERT INTO UPDATE DELETE JOIN ON GROUP BY ORDER LIMIT CREATE TABLE AND OR NOT NULL AS HAVING VALUES SET").split(" "));
const HASH = new Set(["python", "py", "bash", "sh", "shell", "zsh", "ruby", "rb", "perl", "r", "powershell", "ps1", "elixir", "julia", "yaml", "yml"]);
const DASH = new Set(["sql", "lua", "haskell"]);
const STR = /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`/.source;
const NUM = /\b\d+(?:\.\d+)?\b/.source;
const IDN = /\b[A-Za-z_][A-Za-z0-9_]*\b/.source;
const C_SLASH = /\/\/[^\n]*|\/\*[\s\S]*?\*\//.source;
const C_HASH = /#[^\n]*/.source;
const C_DASH = /--[^\n]*/.source;
const C_HTML = "<" + "!--[\\s\\S]*?-->";

function highlight(code, lang) {
  const l = (lang || "").toLowerCase();
  const cm = HASH.has(l) ? C_HASH : DASH.has(l) ? C_DASH : (l === "html" || l === "xml") ? C_HTML : C_SLASH;
  const re = new RegExp("(" + cm + ")|(" + STR + ")|(" + NUM + ")|(" + IDN + ")", "g");
  const sql = l === "sql";
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const tok = m[0];
    let cls = "";
    if (m[1] !== undefined) cls = "c";
    else if (m[2] !== undefined) cls = "s";
    else if (m[3] !== undefined) cls = "n";
    else if (KW.has(tok) || (sql && KW.has(tok.toUpperCase()))) cls = "k";
    out += cls ? '<span class="t-' + cls + '">' + esc(tok) + "</span>" : esc(tok);
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

// Markdown بسيط: كتل الكود، الكود المضمّن، الخط العريض، الفقرات
function render(text) {
  const parts = text.split("```");
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf("\n");
      let lang = "", code = part;
      if (nl >= 0) { lang = part.slice(0, nl).trim(); code = part.slice(nl + 1); }
      code = code.replace(/\n$/, "");
      html += '<div class="code"><div class="code-bar"><span>' + esc(lang || "code") +
        '</span><button class="copy" type="button">' + t().copy + "</button></div><pre><code>" +
        highlight(code, lang) + "</code></pre></div>";
    } else {
      let s = esc(part);
      s = s.replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>');
      s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      s = s.split(/\n{2,}/).map((p) => (p.trim() ? "<p>" + p.trim().replace(/\n/g, "<br>") + "</p>" : "")).join("");
      html += s;
    }
  });
  return html;
}

function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }
function thread() {
  let th = messagesEl.querySelector(".thread");
  if (!th) {
    messagesEl.innerHTML = '<div class="thread"></div>';
    th = messagesEl.querySelector(".thread");
  }
  return th;
}

function addRow(role, content, opts) {
  opts = opts || {};
  const row = document.createElement("div");
  row.className = "row " + role + (opts.error ? " error" : "");
  if (role === "user") {
    row.innerHTML = '<div class="bubble"></div>';
    row.querySelector(".bubble").textContent = content;
  } else {
    row.innerHTML = '<div class="avatar"><svg><use href="#mark"/></svg></div><div class="col"><div class="bubble"></div><div class="actions"></div></div>';
    const b = row.querySelector(".bubble");
    if (opts.pending) b.innerHTML = '<span class="dots" aria-label="..."><i></i><i></i><i></i></span>';
    else if (opts.error) b.textContent = content;
    else b.innerHTML = render(content);
  }
  thread().appendChild(row);
  scrollDown();
  return row;
}

function setActions(row, isLast) {
  const box = row.querySelector(".actions");
  if (!box) return;
  box.innerHTML = '<button class="act act-copy" type="button">' + t().copy + "</button>" +
    (isLast ? '<button class="act act-regen" type="button">' + t().regen + "</button>" : "");
}

function showEmpty() {
  messagesEl.innerHTML = "";
  const box = document.createElement("div");
  box.className = "thread";
  box.innerHTML = '<div class="empty" id="empty"><div class="big"><svg><use href="#mark"/></svg></div><h2></h2><p></p></div>';
  box.querySelector("h2").textContent = t().emptyTitle;
  box.querySelector("p").textContent = t().emptyText;
  messagesEl.appendChild(box);
}

function renderChat() {
  const c = current();
  if (!c || c.messages.length === 0) { showEmpty(); return; }
  messagesEl.innerHTML = "";
  c.messages.forEach((m, i) => {
    const row = addRow(m.role, m.content);
    if (m.role === "assistant") setActions(row, i === c.messages.length - 1);
  });
  scrollDown();
}

function renderList() {
  const list = $("chatList");
  list.innerHTML = "";
  const filled = chats.filter((c) => c.messages.length > 0);
  if (filled.length === 0) {
    const n = document.createElement("div");
    n.className = "none";
    n.textContent = t().noChats;
    list.appendChild(n);
    return;
  }
  filled.forEach((c) => {
    const item = document.createElement("div");
    item.className = "item" + (c.id === currentId ? " active" : "");
    const open = document.createElement("button");
    open.type = "button";
    open.className = "open-chat";
    open.textContent = c.title || "...";
    open.addEventListener("click", () => { currentId = c.id; saveChats(); renderAll(); closeSide(); });
    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "×";
    del.setAttribute("aria-label", t().del);
    del.addEventListener("click", () => {
      chats = chats.filter((x) => x.id !== c.id);
      if (currentId === c.id) { currentId = null; if (chats.length === 0) newChat(); else currentId = chats[0].id; }
      saveChats();
      renderAll();
    });
    item.appendChild(open);
    item.appendChild(del);
    list.appendChild(item);
  });
}

function renderAll() {
  renderList();
  renderChat();
  const c = current();
  $("topTitle").textContent = c && c.title ? c.title : t().newChat;
}

function applyLang() {
  const L = t();
  document.documentElement.lang = uiLang;
  document.documentElement.dir = uiLang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll(".js-lang").forEach((b) => { b.textContent = L.toggle; });
  document.querySelectorAll(".js-bg").forEach((b) => { b.textContent = b.dataset.short ? "✦" : "✦ " + L.bg; });
  $("newChatLbl").textContent = L.newChat;
  $("chatsLbl").textContent = L.chats;
  inputEl.placeholder = L.placeholder;
  $("note").textContent = L.note;
  $("remaining").textContent = lastRemaining === null ? "" : L.remaining + lastRemaining;

  const sel = $("codeLang");
  const keep = sel.value;
  sel.innerHTML = "";
  const any = document.createElement("option");
  any.value = "";
  any.textContent = L.anyLang;
  sel.appendChild(any);
  CODE_LANGS.forEach((name) => {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    sel.appendChild(o);
  });
  sel.value = keep;
  renderAll();
}

// ---------- Chat flow ----------
function reveal(row, text, done) {
  const b = row.querySelector(".bubble");
  if (reduceMotion || text.length < 40) { b.innerHTML = render(text); done(); return; }
  let i = 0;
  const step = Math.max(4, Math.ceil(text.length / 90));
  (function tick() {
    i = Math.min(text.length, i + step);
    b.innerHTML = render(text.slice(0, i));
    scrollDown();
    if (i < text.length) requestAnimationFrame(tick); else done();
  })();
}

async function reply(restoreText) {
  const c = current();
  const L = t();
  busy = true;
  sendEl.disabled = true;

  if (WORKER_URL.includes("YOUR-WORKER")) {
    if (restoreText !== undefined) { c.messages.pop(); if (c.messages.length === 0) c.title = ""; inputEl.value = restoreText; saveChats(); renderAll(); }
    addRow("assistant", L.errConfig, { error: true });
    busy = false; sendEl.disabled = false;
    return;
  }

  const pending = addRow("assistant", "", { pending: true });
  let payload = c.messages.slice(-20).map((m) => ({ role: m.role, content: m.content.slice(0, 4000) }));
  while (payload.length && payload[0].role !== "user") payload.shift();

  const fail = (msg) => {
    pending.remove();
    if (restoreText !== undefined) { c.messages.pop(); if (c.messages.length === 0) c.title = ""; inputEl.value = restoreText; saveChats(); renderAll(); }
    addRow("assistant", msg, { error: true });
  };

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: payload,
        codeLang: $("codeLang").value,
        uiLang: uiLang
      })
    });
    const data = await res.json().catch(() => ({}));

    if (!res.ok || !data.reply) {
      if (res.status === 429) { lastRemaining = 0; $("remaining").textContent = L.remaining + 0; }
      fail(res.status === 429 ? L.errLimit : res.status === 503 ? L.errBusy : L.errGeneric);
    } else {
      c.messages.push({ role: "assistant", content: data.reply });
      saveChats();
      if (typeof data.remaining === "number") {
        lastRemaining = data.remaining;
        $("remaining").textContent = L.remaining + data.remaining;
      }
      pending.querySelector(".bubble").innerHTML = "";
      reveal(pending, data.reply, () => {
        messagesEl.querySelectorAll(".act-regen").forEach((b) => b.remove());
        setActions(pending, true);
        scrollDown();
      });
    }
  } catch (e) {
    fail(L.errNetwork);
  } finally {
    busy = false;
    sendEl.disabled = false;
    inputEl.focus();
  }
}

function send(textArg) {
  const text = (textArg !== undefined ? textArg : inputEl.value).trim();
  if (!text || busy) return;
  const c = current();
  const empty = $("empty");
  if (empty) messagesEl.innerHTML = "";
  if (c.messages.length === 0) c.title = text.slice(0, 42);
  c.messages.push({ role: "user", content: text });
  saveChats();
  renderList();
  $("topTitle").textContent = c.title;
  addRow("user", text);
  inputEl.value = "";
  inputEl.style.height = "auto";
  reply(text);
}

function regenerate() {
  const c = current();
  if (busy || !c || c.messages.length === 0) return;
  if (c.messages[c.messages.length - 1].role !== "assistant") return;
  c.messages.pop();
  saveChats();
  const rows = messagesEl.querySelectorAll(".row.assistant");
  if (rows.length) rows[rows.length - 1].remove();
  reply();
}

// ---------- Events ----------
messagesEl.addEventListener("click", (e) => {
  const copyCode = e.target.closest(".copy");
  if (copyCode) {
    const code = copyCode.closest(".code").querySelector("code").textContent;
    navigator.clipboard.writeText(code).then(() => {
      copyCode.textContent = t().copied;
      setTimeout(() => { copyCode.textContent = t().copy; }, 1500);
    });
    return;
  }
  const copyMsg = e.target.closest(".act-copy");
  if (copyMsg) {
    const rows = [...messagesEl.querySelectorAll(".row.assistant:not(.error)")];
    const idx = rows.indexOf(copyMsg.closest(".row"));
    const c = current();
    const assistantMsgs = c.messages.filter((m) => m.role === "assistant");
    const msg = assistantMsgs[idx];
    if (msg) {
      navigator.clipboard.writeText(msg.content).then(() => {
        copyMsg.textContent = t().copied;
        setTimeout(() => { copyMsg.textContent = t().copy; }, 1500);
      });
    }
    return;
  }
  if (e.target.closest(".act-regen")) regenerate();
});

sendEl.addEventListener("click", () => send());
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
});
$("newChat").addEventListener("click", () => { if (!busy) { newChat(); closeSide(); inputEl.focus(); } });
document.querySelectorAll(".js-lang").forEach((b) => b.addEventListener("click", () => {
  uiLang = uiLang === "ar" ? "en" : "ar";
  try { localStorage.setItem("pac_lang", uiLang); } catch (e) {}
  applyLang();
}));
function closeSide() { $("side").classList.remove("open"); $("scrim").classList.remove("show"); }
$("menuBtn").addEventListener("click", () => { $("side").classList.add("open"); $("scrim").classList.add("show"); });
$("scrim").addEventListener("click", closeSide);

// ---------- Animated golden background ----------
const canvas = $("bg");
const ctx = canvas.getContext("2d");
let dust = [];
let rafId = null;
let bgOn = true;
try { bgOn = localStorage.getItem("pac_bg") !== "off"; } catch (e) {}

function sizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = window.innerWidth < 700 ? 34 : 70;
  dust = Array.from({ length: n }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: 0.5 + Math.random() * 1.9,
    vy: 0.08 + Math.random() * 0.32,
    vx: (Math.random() - 0.5) * 0.18,
    a: 0.25 + Math.random() * 0.55,
    p: Math.random() * Math.PI * 2
  }));
}
function frame(ts) {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);
  for (const d of dust) {
    d.y -= d.vy; d.x += d.vx + Math.sin(ts / 3000 + d.p) * 0.08;
    if (d.y < -4) { d.y = h + 4; d.x = Math.random() * w; }
    if (d.x < -4) d.x = w + 4; else if (d.x > w + 4) d.x = -4;
    const tw = 0.55 + 0.45 * Math.sin(ts / 900 + d.p);
    const alpha = d.a * tw * 0.7;
    ctx.fillStyle = "rgba(243, 220, 138, " + alpha.toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.2832); ctx.fill();
    if (d.r > 1.5) {
      ctx.fillStyle = "rgba(212, 169, 60, " + (alpha * 0.18).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 4, 0, 6.2832); ctx.fill();
    }
  }
  rafId = requestAnimationFrame(frame);
}
function startBg() {
  if (rafId || reduceMotion || !bgOn) return;
  sizeCanvas();
  rafId = requestAnimationFrame(frame);
}
function stopBg() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
function syncBg() {
  document.body.classList.toggle("no-anim", !bgOn);
  document.querySelectorAll(".js-bg").forEach((b) => {
    b.classList.toggle("off", !bgOn);
    b.setAttribute("aria-pressed", String(bgOn));
  });
  if (bgOn) startBg(); else stopBg();
}
document.querySelectorAll(".js-bg").forEach((b) => b.addEventListener("click", () => {
  bgOn = !bgOn;
  try { localStorage.setItem("pac_bg", bgOn ? "on" : "off"); } catch (e) {}
  syncBg();
}));
window.addEventListener("resize", () => { if (rafId) sizeCanvas(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopBg(); else if (bgOn) startBg();
});

// ---------- Init ----------
loadChats();
if (!current()) { chats = chats.filter((c) => c.messages.length > 0); newChat(); }
applyLang();
syncBg();
</script>
